<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>View Animations</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.5/css/bulma.css" type="text/css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.0.1/css/ol.css" type="text/css">
    <script src="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.0.1/build/ol.js"></script>
</head>
<style>
    .map {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        left: 15%;
        font-family: Arial, sans-serif;
    }

    .pane {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 15%;
        background: #fff;
        box-sizing: border-box;
        padding: 0 20px;
        -webkit-box-shadow: 10px -1px 7px -8px rgba(0, 0, 0, 0.42);
        -moz-box-shadow: 10px -1px 7px -8px rgba(0, 0, 0, 0.42);
        box-shadow: 10px -1px 7px -8px rgba(0, 0, 0, 0.42);
    }
</style>

<body>
    <div id="map" class="map"></div>
    <div class="pane">
        <h1 class="is-size-5">View Animations</h1>
        <hr>
        <div class="box">
            <label class="label">Select City</label>
            <div class="level">
                <div class="field">
                    <div class="select">
                        <select id="cityCoords">
                            <option value="1778603,5748965">Zagreb</option>
                            <option value="264453,6252399">Paris</option>
                            <option value="-13605.791,6710569.142">London</option>
                            <option value="-8240828.893,4973929.414">New York</option>
                            <option value="1022536.346,5694331.685">Milano</option>
                            <option value="1753446.320,5806234.300">Pregrada</option>
                        </select>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <script src="./map.js"></script>
</body>

</html>
