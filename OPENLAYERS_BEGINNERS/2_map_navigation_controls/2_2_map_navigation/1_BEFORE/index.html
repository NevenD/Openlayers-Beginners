<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Map Overlay</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.5/css/bulma.css" type="text/css">
    <link rel="stylesheet" href="../../../src/ol.css" type="text/css">
    <script src="../../../src/ol.js"></script>
</head>
<style>
    .map {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        left: 15%;
        font-family: Arial, sans-serif;
    }

    .pane {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 15%;
        background: #fff;
        box-sizing: border-box;
        padding: 0 20px;
        -webkit-box-shadow: 10px -1px 7px -8px rgba(0, 0, 0, 0.42);
        -moz-box-shadow: 10px -1px 7px -8px rgba(0, 0, 0, 0.42);
        box-shadow: 10px -1px 7px -8px rgba(0, 0, 0, 0.42);
    }

    .controls {
        list-style: none;
        padding: 0;
    }

    /* .controls li {
        margin: 0 0 5px 0;
    } */
</style>

<body>
    <div id="map" class="map"></div>
    <div class="pane">
        <h1 class="is-size-5">Controls</h1>
        <hr>
        <div class="box">
            <label class="label">Zoom To Map</label>
            <div class="level">
                <div class="field">
                    <div class="control">
                        <input id="zoom" class="input is-primary" type="number">
                    </div>
                </div>
            </div>
        </div>
        <div class="box">
            <label class="label">Map Rotation</label>
            <div class="level">
                <div class="field">
                    <div class="control">
                        <input id="rot" class="input is-primary" type="number">
                    </div>
                </div>
            </div>
        </div>
        <div class="box">
            <label class="label">Longitude</label>
            <div class="level">
                <div class="field">
                    <div class="control">
                        <input id="long" class="input is-primary" type="number">
                    </div>
                </div>

            </div>
        </div>
        <div class="box">
            <label class="label">Latitude</label>
            <div class="level">
                <div class="field">
                    <div class="control">
                        <input id="lat" class="input is-primary" type="number">
                    </div>
                </div>
            </div>
        </div>
        <div class="box">
            <label class="label">Latitude</label>
            <div class="level">
                <div class="field">
                    <div class="control">
                        <button class="button" onclick="goHome()">Reset View</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./map.js"></script>
</body>

</html>
