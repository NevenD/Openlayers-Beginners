<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Read Feature Properties</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.5/css/bulma.css" type="text/css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma-extensions@4.0.0/dist/css/bulma-extensions.min.css" type="text/css">
    <link rel="stylesheet" href="../../../src/ol.css" type="text/css">
    <script src="../../../src/ol.js"></script>
</head>
<style>
    .map {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        left: 15%;
        font-family: Arial, sans-serif;
    }

    .pane {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 15%;
        background: #fff;
        box-sizing: border-box;
        padding: 0 20px;
        -webkit-box-shadow: 10px -1px 7px -8px rgba(0, 0, 0, 0.42);
        -moz-box-shadow: 10px -1px 7px -8px rgba(0, 0, 0, 0.42);
        box-shadow: 10px -1px 7px -8px rgba(0, 0, 0, 0.42);
    }
</style>

<body>
    <div id="map" class="map"></div>
    <div class="pane">
        <h1 class="is-size-5">Feature List</h1>
        <hr>
        <div class="box">
            <div class="list is-hoverable" id="featureList">
            </div>
        </div>
        <div class="box">
            <article class="media">
                <figure class="media-left">
                    <p class="image is-48x48">
                        <img class="is-rounded" src="https://khms1.googleapis.com/kh?v=859&hl=en-GB&x=5321&y=12616&z=15">
                    </p>
                </figure>
                <div class="media-content">
                    <div class="content">
                        <small>Field properties</small>
                        <hr>
                        <p class="is-small" id="fieldName"></p>
                        <p id="fieldCulture"></p>
                        <p id="fieldDesc"></p>
                        <p id="fieldArea"></p>
                    </div>

            </article>
        </div>
    </div>
    <script src="./map.js"></script>
</body>

</html>
