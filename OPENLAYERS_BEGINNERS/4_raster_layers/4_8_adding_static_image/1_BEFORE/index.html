<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Raster Opacity</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.5/css/bulma.css" type="text/css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma-extensions@4.0.0/dist/css/bulma-extensions.min.css"
        type="text/css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.0.1/css/ol.css" type="text/css">
    <script src="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.0.1/build/ol.js"></script>
</head>
<style>
    .map {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        left: 15%;
        font-family: Arial, sans-serif;
    }

    .pane {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 15%;
        background: #fff;
        box-sizing: border-box;
        padding: 0 20px;
        -webkit-box-shadow: 10px -1px 7px -8px rgba(0, 0, 0, 0.42);
        -moz-box-shadow: 10px -1px 7px -8px rgba(0, 0, 0, 0.42);
        box-shadow: 10px -1px 7px -8px rgba(0, 0, 0, 0.42);
    }
</style>

<body>
    <div id="map" class="map"></div>
    <div class="pane">
        <h1 class="is-size-5">Setting Layer Opacity</h1>
        <hr>
        <div class="box">
            <label class="label">Change opacity</label>
            <div class="level">
                <div class="field">
                    <input class="is-checkradio" type="checkbox" id="wmsLayer" name="wmsLayer">
                    <label for="wmsLayer">WMS layer</label>
                    <input class="slider is-small is-fullwidth is-success is-circle" id="opacitySlider" disabled
                        step="1" min="0" max="100" value="100" type="range">
                </div>
                <div class="field">

                </div>
            </div>
        </div>
    </div>
    <script src="./map.js"></script>
</body>

</html>
